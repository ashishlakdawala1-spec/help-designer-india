<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect for a Service — HELP Designer India</title>
<meta name="description" content="Tell HelpDesignerIndia which fashion service you need — sourcing, dyeing, printing, embroidery, production or design — and we'll connect on WhatsApp." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="enquiry.css" />

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="container nav-inner">
    <a href="index.html" class="logo" aria-label="Help Designer India home">
      <span class="logo-main">HELP</span>
      <span class="logo-sub">DESIGNER INDIA</span>
    </a>
    <a href="index.html#services" class="back-link">← Back to site</a>
  </div>
</header>

<main class="enq-wrap">
  <div class="container">
    <div class="enq-head">
      <p class="eyebrow accent">End-to-End Fashion Services</p>
      <h1>Tell Us What <span class="accent">You Need</span></h1>
      <p>Share your details and the service you're looking for. We'll review your requirement and connect with you on WhatsApp.</p>
    </div>

    <form class="enq-form form-card" id="enqForm" novalidate>
      <h2 class="card-title">Connect for a Service</h2>
      <div class="title-rule"></div>

      <div class="field">
        <span class="field-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
        <input type="text" name="name" placeholder="Your Name" autocomplete="name" required />
      </div>
      <div class="field">
        <span class="field-ic"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-3 2a12 12 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z"/></svg></span>
        <input type="tel" name="phone" placeholder="Phone / WhatsApp Number" autocomplete="tel" />
      </div>
      <div class="field">
        <span class="field-ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <input type="email" name="email" placeholder="Email Address (optional)" autocomplete="email" />
      </div>
      <div class="field">
        <span class="field-ic"><svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/></svg></span>
        <input type="text" name="brand" placeholder="Your Brand / Business Name (optional)" />
      </div>
      <div class="field">
        <span class="field-ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>
        <select name="service" id="service" required>
          <option value="" disabled selected>Service Needed</option>
          <option>Fabric Sourcing</option>
          <option>Fabric Dyeing</option>
          <option>Printing Services</option>
          <option>Embroidery &amp; Handwork</option>
          <option>Stitching &amp; Production</option>
          <option>Fashion Designing &amp; Illustration</option>
          <option>Multiple Services</option>
          <option>Not sure / Other</option>
        </select>
      </div>
      <div class="field area">
        <span class="field-ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg></span>
        <textarea name="requirement" placeholder="Describe what you need — fabric type, quantity, timeline, or any details..."></textarea>
      </div>

      <button type="button" class="btn btn-solid full" id="sendEnq">Send Enquiry on WhatsApp →</button>
    </form>
  </div>

  <footer class="enq-footer">
    <div class="container">
      <a class="pf" href="index.html">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        helpdesignerindia.com
      </a>
      <a class="pf" href="https://instagram.com/helpdesignerindia" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        @helpdesignerindia
      </a>
      <a class="pf" href="https://wa.me/919537656086" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M20 4L3 11l6 2 2 6 3-4 4 3z"/></svg>
        +91 95376 56086
      </a>
    </div>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="enquiry.js?v=1"></script>
<script defer src="analytics.js?v=1"></script>
